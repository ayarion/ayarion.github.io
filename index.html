<style>
  /* one committed look: a dusk sky -- cream above, lavender and blue-grey through the middle,
     a cooler blue to the right, the palest pink and violet along the bottom */
  :root{
    --sky-cream:#f7f2ea;
    --sky-lav:#d9cfe8;
    --sky-grey:#c0c8db;
    --sky-blue:#aabfe0;
    --sky-pink:#f0d0e0;
    --sky-violet:#cbb6e4;
    --bg-mid:#d5cde6;

    --ink:#2c3040;
    --ink-2:rgba(44,48,64,.72);
    --ink-3:rgba(44,48,64,.5);

    --glass:rgba(255,255,255,.32);
    --glass-hi:rgba(255,255,255,.75);
    --rim-a:rgba(255,255,255,.95);
    --rim-b:rgba(255,255,255,.18);
    --hairline:rgba(44,48,64,.13);

    --frame-shadow:0 24px 50px -22px rgba(70,56,110,.38);
    --ease:cubic-bezier(.16,1,.3,1);
  }

  *{margin:0;padding:0;box-sizing:border-box}
  html{background:var(--bg-mid);scroll-behavior:smooth}
  body{
    font-family:"Inter Tight","Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
    background:var(--bg-mid);color:var(--ink);
    font-size:15px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
    min-height:100svh;overflow-x:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:-1;
    background:
      radial-gradient(70% 55% at 12% 4%, var(--sky-cream) 0%, transparent 62%),
      radial-gradient(55% 60% at 94% 30%, var(--sky-blue) 0%, transparent 62%),
      radial-gradient(65% 50% at 28% 102%, var(--sky-pink) 0%, transparent 60%),
      radial-gradient(55% 50% at 86% 102%, var(--sky-violet) 0%, transparent 60%),
      linear-gradient(170deg, var(--sky-cream) 0%, var(--sky-lav) 46%, var(--sky-grey) 100%);
  }
  a{color:inherit;text-decoration:none}
  img{display:block;max-width:100%}
  :focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:6px}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---------- liquid glass ---------- */
  .glass{
    position:relative;background:var(--glass);
    backdrop-filter:blur(28px) saturate(150%);
    -webkit-backdrop-filter:blur(28px) saturate(150%);
    box-shadow:0 1px 2px rgba(70,56,110,.10), inset 0 1px 1px var(--glass-hi);
    overflow:hidden;
  }
  .glass::before{
    content:"";position:absolute;inset:0;border-radius:inherit;padding:1.2px;
    background:linear-gradient(180deg,var(--rim-a) 0%,var(--rim-b) 24%,transparent 44%,transparent 56%,var(--rim-b) 76%,var(--rim-a) 100%);
    -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;
            mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
            mask-composite:exclude;
    pointer-events:none;
  }

  .shell{max-width:1360px;margin:0 auto;padding:0 clamp(16px,3.6vw,36px)}

  /* ---------- nav ---------- */
  .nav{position:fixed;top:clamp(12px,2vw,20px);left:0;right:0;z-index:50;pointer-events:none}
  .nav .shell{display:flex;justify-content:space-between;align-items:center}
  .nav a,.nav .bar{pointer-events:auto}
  .mark{
    width:48px;height:48px;border-radius:50%;display:grid;place-items:center;
    transition:transform 240ms var(--ease);
  }
  .mark:hover{transform:translateY(-1px)}
  .mark svg{width:26px;height:16px}
  .bar{
    display:flex;align-items:center;gap:4px;border-radius:999px;padding:5px;
  }
  .bar a{
    display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:999px;
    font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);
    transition:color 200ms var(--ease),background 200ms var(--ease);
  }
  .bar a:hover{color:var(--ink);background:rgba(255,255,255,.35)}
  .bar a svg{width:11px;height:11px}

  /* ---------- hero ---------- */
  .hero{position:relative;height:100svh;min-height:560px;overflow:hidden}
  .hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .hero-text{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;
    text-align:left;padding:0 clamp(24px,8vw,120px);
    transition:opacity 600ms var(--ease);
  }
  .hero.gl .hero-text{opacity:0;pointer-events:none}
  .hero-text h1{
    max-width:min(46vw,520px);
    font-size:clamp(40px,4.6vw,76px);font-weight:800;letter-spacing:-.03em;line-height:.95;
    color:rgba(255,255,255,.92);
  }
  @media (max-width:700px){ .hero-text h1{max-width:none;font-size:clamp(56px,17vw,80px)} }
  .sig{
    position:absolute;left:clamp(16px,3.6vw,36px);bottom:clamp(18px,3vh,30px);
    border-radius:999px;padding:11px 18px;
    font-size:12.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);
  }
  .hero-fade{
    position:absolute;left:0;right:0;bottom:0;height:22%;pointer-events:none;
    background:linear-gradient(to bottom,transparent,rgba(213,205,230,.55));
  }
  .cue{
    position:absolute;left:50%;bottom:clamp(18px,3vh,30px);transform:translateX(-50%);
    width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);
    transition:color 200ms var(--ease),transform 200ms var(--ease);
  }
  .cue:hover{color:var(--ink);transform:translate(-50%,2px)}
  .cue svg{width:14px;height:14px;animation:nudge 2.4s var(--ease) infinite}
  @keyframes nudge{0%,100%{transform:translateY(-2px)}50%{transform:translateY(3px)}}

  /* ---------- works : the stream ---------- */
  .works{padding:clamp(84px,10vw,130px) 0 clamp(24px,4vw,48px);scroll-margin-top:0}
  .label{
    display:flex;align-items:center;gap:14px;margin-bottom:clamp(18px,3vw,32px);
    font-size:12px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);
  }
  .label::after{content:"";flex:1;height:1px;background:var(--hairline)}
  .stream{
    position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
    gap:clamp(12px,1.6vw,22px);height:min(92svh,900px);
    -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 10%,#000 88%,transparent 100%);
            mask-image:linear-gradient(to bottom,transparent 0,#000 10%,#000 88%,transparent 100%);
  }
  .stream-col{
    overflow:hidden;
    opacity:0;transform:translateY(90px);
    transition:opacity 1100ms var(--ease),transform 1100ms var(--ease);
  }
  .stream-col:nth-child(2){transition-delay:.12s}
  .stream-col:nth-child(3){transition-delay:.24s}
  .stream.live .stream-col{opacity:1;transform:none}
  .stream-track{
    display:flex;flex-direction:column;gap:clamp(12px,1.6vw,22px);will-change:transform;
    animation:drift var(--dur,74s) linear infinite;animation-delay:var(--delay,0s);
    animation-play-state:paused;
  }
  .stream.live .stream-track{animation-play-state:running}
  .stream:hover .stream-track{animation-play-state:paused}
  @keyframes drift{to{transform:translateY(-50%)}}
  .frame{
    flex:none;border-radius:clamp(12px,1.3vw,18px);overflow:hidden;
    background:var(--glass);box-shadow:var(--frame-shadow),inset 0 0 0 1px rgba(255,255,255,.55);
  }
  .frame img{width:100%;height:auto;aspect-ratio:780/1688;object-fit:cover}

  /* ---------- index : the names ---------- */
  .index{padding:clamp(24px,4vw,48px) 0 clamp(72px,10vw,140px)}
  .names{display:flex;flex-direction:column;gap:clamp(10px,1.2vw,14px)}
  /* the works cards keep the old dark-glass tile so the titles stay white,
     even though the page around them turned into a pale dusk sky */
  .name{
    display:flex;align-items:center;justify-content:space-between;gap:20px;
    border-radius:22px;padding:clamp(18px,2.6vw,30px) clamp(20px,3vw,36px);
    font-size:clamp(30px,5.4vw,72px);font-weight:800;letter-spacing:-.04em;line-height:1;
    color:#fff;
    background:linear-gradient(155deg, rgba(58,50,86,.62), rgba(38,32,60,.62));
    box-shadow:0 1px 2px rgba(30,20,50,.3), inset 0 1px 1px rgba(255,255,255,.22);
    transition:transform 320ms var(--ease),box-shadow 320ms var(--ease);
  }
  .name:hover{transform:translateY(-3px);box-shadow:0 30px 60px -30px rgba(30,20,50,.6),inset 0 1px 1px rgba(255,255,255,.3)}
  .name .t{transition:transform 320ms var(--ease);min-width:0}
  .name:hover .t{transform:translateX(6px)}
  .name .sub{
    display:block;margin-top:clamp(6px,.8vw,10px);
    font-family:"Inter Tight","Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;
    font-size:clamp(11px,1vw,13px);font-weight:500;letter-spacing:.16em;line-height:1;color:rgba(255,255,255,.5);
  }
  .name .go{
    flex:none;width:clamp(40px,4vw,56px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
    color:rgba(255,255,255,.65);box-shadow:inset 0 0 0 1px rgba(255,255,255,.28);
    transition:transform 320ms var(--ease),color 320ms var(--ease),box-shadow 320ms var(--ease);
  }
  .name:hover .go{color:#fff;transform:translate(3px,-3px);box-shadow:inset 0 0 0 1px #fff}
  .name .go svg{width:40%;height:40%}

  /* ---------- footer ---------- */
  footer{padding-bottom:calc(clamp(18px,3vw,30px) + env(safe-area-inset-bottom))}
  .foot{
    border-radius:999px;padding:14px clamp(18px,2.4vw,26px);
    display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;
    font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  }
  .foot a{transition:color 200ms var(--ease)}
  .foot a:hover{color:var(--ink)}

  /* ---------- responsive ---------- */
  @media (max-width:980px){
    .stream{grid-template-columns:repeat(2,minmax(0,1fr));height:min(80svh,760px)}
    .stream-col:nth-child(3){display:none}
  }
  @media (max-width:560px){
    .stream{height:70svh;gap:10px}
    .foot{border-radius:22px;justify-content:center;text-align:center}
    .bar a{padding:0 13px}
  }

  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto}
    .stream-col{opacity:1;transform:none;transition:none}
    .stream-track{animation:none}
    .cue svg{animation:none}
  }
</style>
</head>

<script>
(function () {
  document.getElementById('year').textContent = new Date().getFullYear();

  var calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- the stream wakes up once it is scrolled into view ---------- */
  var stream = document.getElementById('stream');
  if (calm || !('IntersectionObserver' in window)) {
    stream.classList.add('live');
  } else {
    var so = new IntersectionObserver(function (entries) {
      if (entries.some(function (e) { return e.isIntersecting; })) {
        stream.classList.add('live');
        so.disconnect();
      }
    }, { threshold: 0.18 });
    so.observe(stream);
  }

  /* ---------- the chain ---------- */
  if (typeof THREE === 'undefined') return;
  var canvas = document.getElementById('stage');
  var hero = document.getElementById('hero');
  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false, powerPreference: 'high-performance' });
  } catch (e) { return; }

  var narrow = window.innerWidth < 700;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, narrow ? 1.25 : 1.5));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.9;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  var scene = new THREE.Scene();
  /* far links dissolve into the haze of the sky: depth reads as softness */
  scene.fog = new THREE.Fog(0xd6cfe6, 22, 46);
  var camera = new THREE.PerspectiveCamera(30, 1, 0.1, 120);
  camera.position.set(0, 0, 16);
  var LOOK = new THREE.Vector3(0.6, 0.2, 0);
  camera.lookAt(LOOK);

  /* the environment feeds only the glass's reflections, never what the camera sees directly
     (the visible backdrop below is its own soft dusk gradient) -- so it is free to be a real
     studio rig: bright cream key, a near-black floor for the dark contrast glass needs to read
     as glass rather than white plastic, punchy blue and pink accents picked up at the edges */
  var pmrem = new THREE.PMREMGenerator(renderer);
  var envScene = new THREE.Scene();
  var dome = new THREE.Mesh(
    new THREE.SphereGeometry(60, 32, 16),
    new THREE.ShaderMaterial({
      side: THREE.BackSide,
      uniforms: {
        top: { value: new THREE.Color(0xfffaf2) },
        mid: { value: new THREE.Color(0x6a6488) },
        bottom: { value: new THREE.Color(0x0a0714) },
        east: { value: new THREE.Color(0x1c2c52) }
      },
      vertexShader: 'varying vec3 p; void main(){ p = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
      fragmentShader: [
        'uniform vec3 top; uniform vec3 mid; uniform vec3 bottom; uniform vec3 east; varying vec3 p;',
        'void main(){',
        '  float h = clamp(p.y/60.0*0.5+0.5, 0.0, 1.0);',
        '  vec3 c = h > 0.5 ? mix(mid, top, pow((h-0.5)*2.0, 1.5)) : mix(bottom, mid, pow(h*2.0, 0.6));',
        '  float e = clamp(p.x/60.0*0.5+0.5, 0.0, 1.0);',
        '  c = mix(c, east, smoothstep(0.5, 1.0, e) * 0.85);',
        '  gl_FragColor = vec4(c, 1.0);',
        '}'
      ].join('\n')
    })
  );
  envScene.add(dome);
  function softbox(w, h, x, y, z, ry, col, k) {
    var c = new THREE.Color(col).multiplyScalar(k);
    var m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide }));
    m.position.set(x, y, z); m.lookAt(0, 0, 0); m.rotation.y += ry || 0; envScene.add(m);
  }
  softbox(26, 10, -20, 26, 12, 0, 0xffffff, 9.0);    /* a hard, bright key -- this is what draws the white edge highlights */
  softbox(14, 26, 32, 6, -4, 0, 0xa9c4ee, 4.2);      /* cool blue fill from the right */
  softbox(36, 5, 0, -26, 16, 0, 0xf7b6d8, 2.0);      /* a thin pink accent low and far */
  softbox(9, 9, 9, 22, 28, 0, 0xffffff, 7.5);        /* a second hard rim, opposite the key */
  softbox(50, 24, -6, -10, -30, 0, 0x05030a, 1.0);   /* a dark flag behind, for contrast bands */
  scene.environment = pmrem.fromScene(envScene, 0.035).texture;
  pmrem.dispose();

  /* backdrop: same sky as the page, so the hero sits flush in it */
  var bgCanvas = document.createElement('canvas');
  bgCanvas.width = 256; bgCanvas.height = 256;
  var g = bgCanvas.getContext('2d');
  var base = g.createLinearGradient(0, 0, 40, 256);
  base.addColorStop(0, '#f7f2ea'); base.addColorStop(0.46, '#d9cfe8'); base.addColorStop(1, '#c0c8db');
  g.fillStyle = base; g.fillRect(0, 0, 256, 256);
  function glow(x, y, rx, ry, col) {
    g.save(); g.translate(x, y); g.scale(rx, ry);
    var rg = g.createRadialGradient(0, 0, 0, 0, 0, 1);
    rg.addColorStop(0, col); rg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = rg; g.beginPath(); g.arc(0, 0, 1, 0, Math.PI * 2); g.fill(); g.restore();
  }
  glow(30, 10, 180, 140, '#f7f2ea');
  glow(240, 76, 140, 155, '#aabfe0');
  glow(72, 260, 165, 128, '#f0d0e0');
  glow(220, 260, 140, 128, '#cbb6e4');
  var bgTex = new THREE.CanvasTexture(bgCanvas);
  bgTex.colorSpace = THREE.SRGBColorSpace;
  var backdrop = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: bgTex, toneMapped: false, fog: false }));
  backdrop.position.z = -14;
  scene.add(backdrop);
  /* a shadow catcher just in front of the backdrop: the chain stops floating */
  var catcher = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.ShadowMaterial({ color: 0x5a4a86, opacity: 0.11, fog: false }));
  catcher.position.z = -13.9;
  catcher.receiveShadow = true;
  scene.add(catcher);

  /* the words live in the scene so the glass can bend them */
  var TEX_W = 2048, TEX_H = 640;
  var textCanvas = document.createElement('canvas');
  textCanvas.width = TEX_W; textCanvas.height = TEX_H;
  var textTex = new THREE.CanvasTexture(textCanvas);
  textTex.colorSpace = THREE.SRGBColorSpace;
  textTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  var words = new THREE.Mesh(
    new THREE.PlaneGeometry(1, TEX_H / TEX_W),
    new THREE.MeshBasicMaterial({ map: textTex, alphaTest: 0.5, transparent: false, toneMapped: false, fog: false })
  );
  words.position.z = -2.6;
  scene.add(words);

  function paintWords() {
    var c = textCanvas.getContext('2d');
    c.clearRect(0, 0, TEX_W, TEX_H);
    c.fillStyle = '#ffffff';
    c.textAlign = 'left';
    c.textBaseline = 'alphabetic';
    var size = 380;
    c.font = '800 ' + size + 'px "Inter Tight", "Inter", "Helvetica Neue", Arial, sans-serif';
    var target = TEX_W * 0.93;
    var w = c.measureText('PORTFOLIO').width;
    size = Math.floor(size * target / w);
    c.font = '800 ' + size + 'px "Inter Tight", "Inter", "Helvetica Neue", Arial, sans-serif';
    c.letterSpacing = '-0.03em';
    c.shadowColor = 'rgba(92,72,140,0.28)';
    c.shadowBlur = 36; c.shadowOffsetY = 10;
    c.fillText('PORTFOLIO', TEX_W * 0.035, TEX_H * 0.5 + size * 0.36);
    c.shadowColor = 'transparent';
    textTex.needsUpdate = true;
    render();
  }

  /* a stadium curve: two straights, two half-circles */
  class Stadium extends THREE.Curve {
    constructor(L, R) { super(); this.L = L; this.R = R; }
    getPoint(t, target) {
      target = target || new THREE.Vector3();
      var L = this.L, R = this.R, arc = Math.PI * R, P = 2 * L + 2 * arc, s = t * P, a;
      if (s < L) return target.set(-L / 2 + s, R, 0);
      s -= L;
      if (s < arc) { a = Math.PI / 2 - s / R; return target.set(L / 2 + R * Math.cos(a), R * Math.sin(a), 0); }
      s -= arc;
      if (s < L) return target.set(L / 2 - s, -R, 0);
      s -= L;
      a = -Math.PI / 2 - s / R;
      return target.set(-L / 2 + R * Math.cos(a), R * Math.sin(a), 0);
    }
  }

  /* big links: the nearest one is meant to leave the frame */
  var L = 2.2, R = 1.55, r = 0.56, PITCH = 4.05, TWIST = 0.14;
  var linkGeo = new THREE.TubeGeometry(new Stadium(L, R), narrow ? 140 : 220, r, narrow ? 22 : 34, true);
  /* thick smoked glass: a cool tint, dark inside, hard white rims */
  function glassFor(depth) {
    return new THREE.MeshPhysicalMaterial({
      color: 0xf3f6fa, metalness: 0, roughness: 0.02,
      transmission: 0.94, thickness: 3.2, ior: 1.5,
      clearcoat: 1, clearcoatRoughness: 0.02,
      envMapIntensity: 2.1 - depth * 0.55, specularIntensity: 1,
      attenuationColor: new THREE.Color(0x8fa3c8), attenuationDistance: 3.4
    });
  }

  /* the path: from very near the lens at bottom-left, bowing out, off the top-right */
  var path = new THREE.CatmullRomCurve3([
    new THREE.Vector3(-14.0, -11.5,  6.0),
    new THREE.Vector3( -7.6,  -6.4,  4.6),
    new THREE.Vector3( -2.6,  -2.4,  1.6),
    new THREE.Vector3(  1.6,   0.6, -1.8),
    new THREE.Vector3(  5.6,   3.0, -5.4),
    new THREE.Vector3( 10.2,   5.0, -9.8),
    new THREE.Vector3( 16.0,   6.4, -15.0)
  ], false, 'centripetal', 0.5);
  var pathLen = path.getLength();
  var N = Math.floor(pathLen / PITCH) + 1;

  var rig = new THREE.Group();
  var chain = new THREE.Group();
  var links = [];
  var X = new THREE.Vector3(1, 0, 0);
  for (var i = 0; i < N; i++) {
    var u = Math.min((i * PITCH) / pathLen, 1);
    var holder = new THREE.Object3D();
    var p = path.getPointAt(u), tan = path.getTangentAt(u);
    holder.position.copy(p);
    holder.quaternion.setFromUnitVectors(X, tan);
    var depth = THREE.MathUtils.clamp((camera.position.z - p.z - 8) / 22, 0, 1);
    var link = new THREE.Mesh(linkGeo, glassFor(depth));
    link.castShadow = true;
    link.receiveShadow = true;
    /* a touch of hand-made irregularity */
    var s = 1 + Math.sin(i * 2.7) * 0.035;
    link.scale.set(s, 1 + Math.cos(i * 1.9) * 0.04, s);
    link.userData.phase = i * (Math.PI / 2 + TWIST);
    link.rotation.x = link.userData.phase;
    holder.add(link);
    chain.add(holder);
    links.push(link);
  }
  rig.add(chain);
  if (narrow) { rig.scale.setScalar(0.72); rig.position.set(1.4, -0.6, 0); rig.rotation.z = 0.28; }
  scene.add(rig);

  var key = new THREE.DirectionalLight(0xfff7ee, 1.05);
  key.position.set(-9, 12, 9);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.radius = 9;
  key.shadow.bias = -0.0004;
  key.shadow.camera.near = 1; key.shadow.camera.far = 60;
  key.shadow.camera.left = -22; key.shadow.camera.right = 22;
  key.shadow.camera.top = 22; key.shadow.camera.bottom = -22;
  scene.add(key);
  var rim = new THREE.DirectionalLight(0xbcd0f2, 0.6);
  rim.position.set(8, -4, -6);
  scene.add(rim);
  scene.add(new THREE.HemisphereLight(0xfbf6ef, 0x8b78b4, 0.28));

  /* sizing */
  function fit() {
    var w = hero.clientWidth, h = hero.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    var t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    var dBack = camera.position.z - backdrop.position.z;
    /* the camera is aimed off-centre, so give the backdrop generous slack */
    backdrop.scale.set(2 * dBack * t * camera.aspect * 1.7, 2 * dBack * t * 1.7, 1);
    backdrop.position.x = LOOK.x * 1.6;
    catcher.scale.copy(backdrop.scale);
    catcher.position.x = backdrop.position.x;
    /* the title sits in the quiet upper-left, well clear of the chain, at half its old size */
    var dText = camera.position.z - words.position.z;
    var visH = 2 * dText * t, visW = visH * camera.aspect;
    /* phones get the word at full width and may run it over the chain; desktop keeps it modest */
    var tw = narrow ? visW * 0.97 : Math.min(visW * 0.34, 5.9);
    words.scale.set(tw, tw, 1);
    var slack = LOOK.x * (dText / camera.position.z);
    words.position.x = narrow ? slack : -visW / 2 + tw / 2 + 0.7 + slack;
    /* on squarer screens the chain climbs higher, so the title climbs with it */
    var yFrac = narrow ? 0.26 : (camera.aspect < 1.25 ? 0.27 : 0.14);
    words.position.y = visH * yFrac + LOOK.y * (dText / camera.position.z);
  }

  /* motion */
  var pointer = { x: 0, y: 0 }, eased = { x: 0, y: 0 };
  window.addEventListener('pointermove', function (e) {
    pointer.x = (e.clientX / window.innerWidth - 0.5) * 2;
    pointer.y = (e.clientY / window.innerHeight - 0.5) * 2;
  }, { passive: true });

  var clock = new THREE.Clock();
  var running = false, visible = true, inView = true, raf = 0;

  function render() { renderer.render(scene, camera); }

  function frame() {
    raf = 0;
    if (!running) return;
    var dt = Math.min(clock.getDelta(), 0.05);
    var t = clock.elapsedTime;
    /* the DNA turn: every link spins about the path it hangs on */
    var spin = t * 0.34;
    for (var j = 0; j < links.length; j++) links[j].rotation.x = links[j].userData.phase + spin;
    chain.position.y = Math.sin(t * 0.3) * 0.16;
    eased.x += (pointer.x - eased.x) * 0.04;
    eased.y += (pointer.y - eased.y) * 0.04;
    camera.position.x = eased.x * 0.55;
    camera.position.y = -eased.y * 0.35;
    camera.lookAt(LOOK);
    render();
    raf = requestAnimationFrame(frame);
  }
  function sync() {
    var should = !calm && visible && inView;
    if (should && !running) { running = true; clock.getDelta(); if (!raf) raf = requestAnimationFrame(frame); }
    if (!should && running) { running = false; }
  }
  document.addEventListener('visibilitychange', function () { visible = !document.hidden; sync(); });
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (entries) { inView = entries[0].isIntersecting; sync(); }, { threshold: 0.02 }).observe(hero);
  }
  window.addEventListener('resize', function () { fit(); render(); });

  fit();
  paintWords();
  hero.classList.add('gl');
  sync();

  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('800 200px "Inter Tight"'),
      document.fonts.load('500 40px "Inter Tight"')
    ]).then(paintWords, function () {});
  }
})();
</script>
</body>
</html>
