<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>作り場 — tsukuriba</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="description" content="つくったものを置いておく場所。個人開発したアプリをまとめています。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231c5cab'/%3E%3Cpath d='M9 21 L16 9 L23 21 Z' fill='none' stroke='white' stroke-width='2.2' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#fbfbfc;
    --surface:#ffffff;
    --ink:#15161a;
    --ink-2:#54555c;
    --ink-3:#93949c;
    --hairline:#e7e7ec;
    --accent:#1c5cab;
    --accent-soft:#eef4fc;
    --shadow:0 1px 2px rgba(20,20,30,.04);
    --shadow-hover:0 18px 36px -18px rgba(20,20,30,.22);
    --ease-out:cubic-bezier(0.16,1,0.3,1);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b0b0d;--surface:#141417;--ink:#f2f2f4;--ink-2:#b3b4bb;--ink-3:#75767e;
      --hairline:#232327;--accent:#7fb0ec;--accent-soft:#182338;
      --shadow:0 1px 2px rgba(0,0,0,.4);--shadow-hover:0 20px 40px -18px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b0b0d;--surface:#141417;--ink:#f2f2f4;--ink-2:#b3b4bb;--ink-3:#75767e;
    --hairline:#232327;--accent:#7fb0ec;--accent-soft:#182338;
    --shadow:0 1px 2px rgba(0,0,0,.4);--shadow-hover:0 20px 40px -18px rgba(0,0,0,.6);
  }
  :root[data-theme="light"]{
    --bg:#fbfbfc;--surface:#ffffff;--ink:#15161a;--ink-2:#54555c;--ink-3:#93949c;
    --hairline:#e7e7ec;--accent:#1c5cab;--accent-soft:#eef4fc;
    --shadow:0 1px 2px rgba(20,20,30,.04);--shadow-hover:0 18px 36px -18px rgba(20,20,30,.22);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{background:var(--bg)}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Segoe UI",sans-serif;
    background:var(--bg);color:var(--ink);font-size:16px;line-height:1.7;
    -webkit-font-smoothing:antialiased;min-height:100vh;
    transition:background 300ms var(--ease-out),color 300ms var(--ease-out);
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 24px calc(72px + env(safe-area-inset-bottom))}

  .topbar{display:flex;justify-content:flex-end;padding:24px 0 0}
  .theme-toggle{
    appearance:none;border:1px solid var(--hairline);background:var(--surface);color:var(--ink-2);
    width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:15px;transition:border-color 200ms var(--ease-out),color 200ms var(--ease-out),transform 150ms var(--ease-out);
  }
  .theme-toggle:hover{border-color:var(--accent);color:var(--accent)}
  .theme-toggle:active{transform:scale(.94)}

  header.hero{padding:64px 0 72px;position:relative}
  .eyebrow{font-size:12px;letter-spacing:.18em;color:var(--ink-3);font-weight:700;margin-bottom:16px;text-transform:uppercase}
  h1{font-size:clamp(40px,9vw,64px);font-weight:800;letter-spacing:-0.02em;line-height:1.08}
  .tagline{margin-top:18px;font-size:17px;color:var(--ink-2);max-width:38ch}

  h2.section-title{
    font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--ink-3);
    margin-bottom:18px;text-transform:uppercase;
  }

  .reveal{opacity:0;transform:translateY(18px);transition:opacity 700ms var(--ease-out),transform 700ms var(--ease-out)}
  .reveal.in{opacity:1;transform:translateY(0)}

  .cards{display:flex;flex-direction:column;gap:16px}
  .card{
    display:flex;align-items:center;gap:18px;
    padding:18px;border:1px solid var(--hairline);border-radius:18px;
    text-decoration:none;color:inherit;background:var(--surface);box-shadow:var(--shadow);
    transition:transform 260ms var(--ease-out),border-color 260ms var(--ease-out),box-shadow 260ms var(--ease-out);
  }
  .card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow-hover)}
  .card:active{transform:translateY(-1px)}

  .thumb{
    flex:none;width:56px;height:56px;border-radius:13px;overflow:hidden;
    background:var(--accent-soft);position:relative;
  }
  .thumb img{
    width:100%;height:100%;object-fit:cover;object-position:top center;
    display:block;transition:transform 400ms var(--ease-out);
  }
  .card:hover .thumb img{transform:scale(1.08)}
  .thumb svg{width:100%;height:100%;display:block}

  .card .body{flex:1;min-width:0}
  .card .name{font-size:17px;font-weight:700}
  .card .desc{font-size:13.5px;color:var(--ink-2);margin-top:3px}
  .card .arrow{flex:none;color:var(--ink-3);font-size:18px;transition:transform 260ms var(--ease-out),color 260ms var(--ease-out)}
  .card:hover .arrow{transform:translateX(4px);color:var(--accent)}

  .soon{
    display:flex;align-items:center;gap:18px;padding:18px;
    border:1px dashed var(--hairline);border-radius:18px;color:var(--ink-3);font-size:14px;
  }
  .soon .icon{
    flex:none;width:56px;height:56px;border-radius:13px;border:1px dashed var(--hairline);
    display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--ink-3);
  }

  footer{margin-top:72px;font-size:12px;color:var(--ink-3);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  footer a{color:var(--ink-3);text-decoration:none;transition:color 200ms var(--ease-out)}
  footer a:hover{color:var(--accent)}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important}
    .reveal{opacity:1;transform:none}
    .card:hover{transform:none}
    .card:hover .thumb img{transform:none}
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="配色を切り替える">◐</button>
    </div>

    <header class="hero">
      <p class="eyebrow reveal">TSUKURIBA</p>
      <h1 class="reveal">作り場</h1>
      <p class="tagline reveal">つくったものを、ここに置いていく。</p>
    </header>

    <main>
      <h2 class="section-title reveal">作ったもの</h2>
      <div class="cards">
        <a class="card reveal" href="https://tsukuriba.org/togame/">
          <span class="thumb">
            <img src="assets/shots/togame-1-dashboard.png" alt="トガメのダッシュボード画面" loading="lazy">
          </span>
          <div class="body">
            <div class="name">トガメ</div>
            <div class="desc">SNSを開いた瞬間に「なんで開いたの？」と問い返すアプリ</div>
          </div>
          <span class="arrow" aria-hidden="true">→</span>
        </a>

        <a class="card reveal" href="https://tsukuriba.org/kinto-log/">
          <span class="thumb">
            <img src="assets/shots/kinto-1-record.png" alt="Kinto-Logの記録画面" loading="lazy">
          </span>
          <div class="body">
            <div class="name">Kinto-Log</div>
            <div class="desc">かわいく続ける、筋トレ記録アプリ</div>
          </div>
          <span class="arrow" aria-hidden="true">→</span>
        </a>

        <a class="card reveal" href="https://tsukuriba.org/OjiMate/">
          <span class="thumb">
            <svg viewBox="0 0 32 32" aria-hidden="true">
              <rect width="32" height="32" fill="#fff1e0"/>
              <circle cx="7" cy="18.5" r="2.6" fill="#e8a97a"/>
              <circle cx="25" cy="18.5" r="2.6" fill="#e8a97a"/>
              <circle cx="16" cy="17" r="9" fill="#e8a97a"/>
              <ellipse cx="14.3" cy="12.4" rx="3.6" ry="2" fill="#ffffff" opacity="0.55"/>
              <ellipse cx="13.4" cy="15.6" rx="0.9" ry="1.1" fill="#4a3a2c"/>
              <ellipse cx="18.6" cy="15.6" rx="0.9" ry="1.1" fill="#4a3a2c"/>
              <path d="M11.5 20.4 Q16 22.3 20.5 20.4" stroke="#8a5a3c" stroke-width="1.6" fill="none" stroke-linecap="round"/>
            </svg>
          </span>
          <div class="body">
            <div class="name">OjiMate</div>
            <div class="desc">集中すれば働き、サボれば一緒にサボる、表裏一体のおじさんと暮らす集中アプリ</div>
          </div>
          <span class="arrow" aria-hidden="true">→</span>
        </a>

        <div class="soon reveal">
          <span class="icon" aria-hidden="true">＋</span>
          <div>次の作品はここに増えていきます</div>
        </div>
      </div>
    </main>

    <footer>
      <span>© <span id="y"></span> 作り場</span>
      <a href="https://github.com/ayarion" target="_blank" rel="noopener">GitHub</a>
    </footer>
  </div>

  <script>
    document.getElementById('y').textContent = new Date().getFullYear();

    var toggle = document.getElementById('themeToggle');
    var root = document.documentElement;
    var stored = localStorage.getItem('theme');
    if (stored) root.setAttribute('data-theme', stored);

    toggle.addEventListener('click', function () {
      var current = root.getAttribute('data-theme') ||
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      var next = current === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    });

    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!reduceMotion && 'IntersectionObserver' in window) {
      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('in');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.2 });
      document.querySelectorAll('.reveal').forEach(function (el) {
        observer.observe(el);
      });
    } else {
      document.querySelectorAll('.reveal').forEach(function (el) {
        el.classList.add('in');
      });
    }
  </script>
</body>
</html>
