<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>作り場 — tsukuriba</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#cadeee">
<meta name="description" content="つくったものを置いておく場所。個人開発したアプリをまとめています。">
<meta property="og:title" content="作り場 — tsukuriba">
<meta property="og:description" content="つくったものを、ここに置いていく。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://tsukuriba.org/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231c5cab'/%3E%3Crect x='6.5' y='11' width='13' height='10' rx='5' fill='none' stroke='white' stroke-width='2.4'/%3E%3Crect x='12.5' y='11' width='13' height='10' rx='5' fill='none' stroke='white' stroke-width='2.4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  /* ---------- tokens : light (default, from the glass-chain reference) ---------- */
  :root{
    --sky-hi:#eaf3fb;
    --sky-mid:#cbdeee;
    --sky-lo:#a9c6df;

    --ink:#0e1c29;
    --ink-2:#3c5568;
    --ink-3:#71899f;

    --accent:#1c5cab;
    --accent-ink:#ffffff;

    --glass:rgba(255,255,255,.34);
    --glass-hi:rgba(255,255,255,.62);
    --glass-edge-a:rgba(255,255,255,.95);
    --glass-edge-b:rgba(255,255,255,.10);
    --hairline:rgba(14,28,41,.10);

    --shadow:0 1px 2px rgba(14,28,41,.05);
    --shadow-lift:0 26px 50px -26px rgba(14,28,41,.42);
    --frame-shadow:0 18px 40px -22px rgba(14,28,41,.55);

    --link-hi:#ffffff;
    --link-mid:#4d7ba6;
    --link-lo:#16324a;

    --ease:cubic-bezier(.16,1,.3,1);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --sky-hi:#0b1724;
      --sky-mid:#091220;
      --sky-lo:#05090f;

      --ink:#e9f2fa;
      --ink-2:#a6bccf;
      --ink-3:#6f8599;

      --accent:#7fb0ec;
      --accent-ink:#06121f;

      --glass:rgba(255,255,255,.055);
      --glass-hi:rgba(255,255,255,.10);
      --glass-edge-a:rgba(255,255,255,.55);
      --glass-edge-b:rgba(255,255,255,.04);
      --hairline:rgba(233,242,250,.12);

      --shadow:0 1px 2px rgba(0,0,0,.5);
      --shadow-lift:0 26px 50px -26px rgba(0,0,0,.85);
      --frame-shadow:0 18px 40px -22px rgba(0,0,0,.9);

      --link-hi:#dbeaf8;
      --link-mid:#5f88ae;
      --link-lo:#14293d;
    }
  }
  :root[data-theme="dark"]{
    --sky-hi:#0b1724;
    --sky-mid:#091220;
    --sky-lo:#05090f;

    --ink:#e9f2fa;
    --ink-2:#a6bccf;
    --ink-3:#6f8599;

    --accent:#7fb0ec;
    --accent-ink:#06121f;

    --glass:rgba(255,255,255,.055);
    --glass-hi:rgba(255,255,255,.10);
    --glass-edge-a:rgba(255,255,255,.55);
    --glass-edge-b:rgba(255,255,255,.04);
    --hairline:rgba(233,242,250,.12);

    --shadow:0 1px 2px rgba(0,0,0,.5);
    --shadow-lift:0 26px 50px -26px rgba(0,0,0,.85);
    --frame-shadow:0 18px 40px -22px rgba(0,0,0,.9);

    --link-hi:#dbeaf8;
    --link-mid:#5f88ae;
    --link-lo:#14293d;
  }

  /* ---------- base ---------- */
  *{margin:0;padding:0;box-sizing:border-box}
  html{background:var(--sky-mid);scroll-behavior:smooth}
  body{
    font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI","Segoe UI",sans-serif;
    background:var(--sky-mid);
    color:var(--ink);
    font-size:16px;line-height:1.75;
    -webkit-font-smoothing:antialiased;
    min-height:100svh;
    overflow-x:hidden;
  }
  /* the sky: fixed so every glass surface samples the same ground */
  body::before{
    content:"";position:fixed;inset:0;z-index:-1;
    background:
      radial-gradient(120% 90% at 8% 4%, var(--sky-hi) 0%, transparent 58%),
      radial-gradient(110% 80% at 96% 92%, var(--sky-lo) 0%, transparent 62%),
      linear-gradient(160deg, var(--sky-hi) 0%, var(--sky-mid) 46%, var(--sky-lo) 100%);
  }
  a{color:inherit;text-decoration:none}
  img{display:block;max-width:100%}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

  .serif{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-weight:400}

  /* ---------- liquid glass ---------- */
  .glass{
    position:relative;
    background:var(--glass);
    backdrop-filter:blur(34px) saturate(165%);
    -webkit-backdrop-filter:blur(34px) saturate(165%);
    box-shadow:var(--shadow), inset 0 1px 1px var(--glass-hi);
    overflow:hidden;
  }
  /* gradient hairline that fades out mid-edge -- the glass rim */
  .glass::before{
    content:"";position:absolute;inset:0;border-radius:inherit;padding:1.3px;
    background:linear-gradient(180deg,
      var(--glass-edge-a) 0%,
      var(--glass-edge-b) 22%,
      transparent 42%,
      transparent 58%,
      var(--glass-edge-b) 78%,
      var(--glass-edge-a) 100%);
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;
            mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite:exclude;
    pointer-events:none;
  }

  .shell{max-width:1320px;margin:0 auto;padding:0 clamp(18px,4vw,40px)}

  /* ---------- top bar ---------- */
  .topbar{position:sticky;top:0;z-index:40;padding-top:clamp(14px,2.4vw,22px)}
  .topbar-inner{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    border-radius:999px;padding:10px 12px 10px 18px;
  }
  .wordmark{display:flex;align-items:center;gap:11px;font-weight:700;letter-spacing:.01em}
  .wordmark .chain{width:42px;height:24px;flex:none}
  .wordmark .name{font-size:16px}
  .wordmark .romaji{
    font-size:12.5px;letter-spacing:.2em;color:var(--ink-3);text-transform:uppercase;
  }
  .topbar-actions{display:flex;align-items:center;gap:8px}
  .pill{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    height:38px;padding:0 16px;border-radius:999px;border:0;
    font:inherit;font-size:13px;font-weight:500;color:var(--ink);
    cursor:pointer;
    transition:transform 200ms var(--ease), color 200ms var(--ease);
  }
  .pill:hover{color:var(--accent);transform:translateY(-1px)}
  .pill:active{transform:translateY(0) scale(.97)}
  .pill.icon{width:38px;padding:0;font-size:15px}

  /* ---------- hero ---------- */
  .hero{
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,1.02fr);
    gap:clamp(24px,4vw,56px);
    align-items:center;
    min-height:min(100svh,880px);
    padding:clamp(36px,6vh,72px) 0 clamp(48px,8vh,88px);
  }
  .hero-copy{max-width:34rem}
  .eyebrow{
    display:inline-flex;align-items:center;gap:12px;
    font-size:clamp(15px,1.5vw,19px);letter-spacing:.24em;text-transform:uppercase;
    color:var(--ink-2);margin-bottom:clamp(16px,2.4vw,24px);
  }
  .eyebrow::after{
    content:"";width:clamp(38px,7vw,74px);height:1px;background:var(--ink-3);opacity:.5;
  }
  h1{
    font-size:clamp(58px,9.2vw,108px);
    font-weight:700;letter-spacing:-.045em;line-height:.98;
    text-wrap:balance;
  }
  .lede{
    margin-top:clamp(18px,2.6vw,26px);
    font-size:clamp(15px,1.35vw,17.5px);
    color:var(--ink-2);max-width:30rem;
  }
  .hero-meta{
    margin-top:clamp(26px,4vw,40px);
    display:flex;flex-wrap:wrap;align-items:center;gap:10px;
  }
  .chip{
    display:inline-flex;align-items:center;gap:9px;
    border-radius:999px;padding:9px 16px;font-size:13px;color:var(--ink-2);
  }
  .chip .dot{
    width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;
    box-shadow:0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent);
    animation:beat 2.6s var(--ease) infinite;
  }
  @keyframes beat{
    0%,100%{box-shadow:0 0 0 0 color-mix(in srgb, var(--accent) 50%, transparent)}
    50%{box-shadow:0 0 0 7px color-mix(in srgb, var(--accent) 0%, transparent)}
  }
  .chip.link{transition:color 200ms var(--ease), transform 200ms var(--ease)}
  .chip.link:hover{color:var(--accent);transform:translateY(-1px)}

  /* ---------- showcase stream (the scrolling columns) ---------- */
  .stream{
    position:relative;
    display:grid;grid-template-columns:1fr 1fr;
    gap:clamp(12px,1.4vw,20px);
    height:min(100svh,880px);
    -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 13%,#000 84%,transparent 100%);
            mask-image:linear-gradient(to bottom,transparent 0,#000 13%,#000 84%,transparent 100%);
  }
  .stream-col{overflow:hidden}
  .stream-track{
    display:flex;flex-direction:column;gap:clamp(12px,1.4vw,20px);
    will-change:transform;
    animation:drift var(--dur,58s) linear infinite;
    animation-delay:var(--delay,0s);
  }
  @keyframes drift{to{transform:translateY(-50%)}}
  .frame{
    border-radius:clamp(12px,1.2vw,17px);
    overflow:hidden;flex:none;
    box-shadow:var(--frame-shadow), inset 0 0 0 1px var(--glass-hi);
    background:var(--glass);
  }
  .frame img{width:100%;height:auto;aspect-ratio:780/1688;object-fit:cover}
  .stream:hover .stream-track{animation-play-state:paused}

  /* ---------- section heading ---------- */
  .section-head{
    display:flex;align-items:baseline;gap:16px;
    margin-bottom:clamp(18px,2.6vw,28px);
  }
  .section-head .count{font-size:19px;color:var(--ink-3)}
  h2{font-size:clamp(22px,2.6vw,30px);font-weight:700;letter-spacing:-.02em}
  .section-head .rule{flex:1;height:1px;background:var(--hairline)}

  /* ---------- works ---------- */
  .works{padding-bottom:clamp(56px,9vw,104px);scroll-margin-top:96px}
  .cards{
    display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
    gap:clamp(12px,1.4vw,18px);
  }
  .card{
    display:flex;align-items:center;gap:clamp(14px,1.8vw,20px);
    border-radius:20px;padding:clamp(15px,1.8vw,20px);
    transition:transform 320ms var(--ease), box-shadow 320ms var(--ease);
  }
  .card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lift), inset 0 1px 1px var(--glass-hi)}
  .card:active{transform:translateY(-1px)}
  .card .thumb{
    flex:none;width:clamp(52px,5.6vw,64px);aspect-ratio:1;border-radius:15px;overflow:hidden;
    box-shadow:inset 0 0 0 1px var(--glass-hi);
  }
  .card .thumb img,.card .thumb svg{width:100%;height:100%;object-fit:cover;object-position:top center}
  .card .thumb img{transition:transform 520ms var(--ease)}
  .card:hover .thumb img{transform:scale(1.09)}
  .card .body{flex:1;min-width:0;display:block}
  .card .name{display:block;font-size:clamp(16px,1.7vw,18px);font-weight:700;letter-spacing:-.01em}
  .card .desc{display:block;font-size:13.5px;color:var(--ink-2);margin-top:3px;line-height:1.62}
  .card .go{
    flex:none;width:36px;height:36px;border-radius:50%;
    display:grid;place-items:center;color:var(--ink-3);
    box-shadow:inset 0 0 0 1px var(--hairline);
    transition:transform 320ms var(--ease), color 320ms var(--ease), box-shadow 320ms var(--ease);
  }
  .card:hover .go{color:var(--accent);transform:translate(3px,-3px);box-shadow:inset 0 0 0 1px var(--accent)}
  .card .go svg{width:15px;height:15px}

  .next{
    display:flex;align-items:center;gap:clamp(14px,1.8vw,22px);
    border-radius:20px;padding:clamp(14px,1.8vw,20px);
    color:var(--ink-3);font-size:13.5px;
    box-shadow:inset 0 0 0 1px var(--hairline);
  }
  .next .slot{
    flex:none;width:clamp(52px,5.6vw,64px);aspect-ratio:1;border-radius:15px;
    display:grid;place-items:center;font-size:19px;
    box-shadow:inset 0 0 0 1px var(--hairline);
  }

  /* ---------- footer ---------- */
  footer{padding-bottom:calc(clamp(22px,3vw,34px) + env(safe-area-inset-bottom))}
  .footer-inner{
    border-radius:999px;padding:14px clamp(18px,2.4vw,26px);
    display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;
    font-size:12.5px;color:var(--ink-3);
  }
  .footer-inner a{transition:color 200ms var(--ease)}
  .footer-inner a:hover{color:var(--accent)}

  /* ---------- entrance ---------- */
  .rise{opacity:0;transform:translateY(22px);
    transition:opacity 900ms var(--ease), transform 900ms var(--ease)}
  .rise.shown{opacity:1;transform:none}
  .d1{transition-delay:.06s}.d2{transition-delay:.14s}.d3{transition-delay:.22s}.d4{transition-delay:.3s}

  /* ---------- responsive ---------- */
  @media (max-width:960px){
    .hero{
      grid-template-columns:1fr;
      min-height:0;
      gap:clamp(28px,6vw,44px);
      padding-top:clamp(28px,6vh,48px);
    }
    .hero-copy{max-width:none}
    .stream{height:min(62svh,520px)}
    .wordmark .romaji{display:none}
    .cards{grid-template-columns:1fr}
  }
  @media (max-width:560px){
    .stream{height:44svh;gap:10px}
    .stream-col:nth-child(2){display:none}
    .stream{grid-template-columns:1fr}
    .card{gap:14px}
    .card .desc{font-size:13px}
    .footer-inner{border-radius:22px;justify-content:center;text-align:center}
  }

  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{transition-duration:.001ms !important;animation-duration:.001ms !important;animation-iteration-count:1 !important}
    .stream-track{animation:none}
    .rise{opacity:1;transform:none}
  }
</style>
</head>
<body>

<!-- reusable glass chain link -->
<svg width="0" height="0" aria-hidden="true" style="position:absolute">
  <defs>
    <linearGradient id="glassRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="var(--link-hi)"  stop-opacity=".98"/>
      <stop offset="32%"  stop-color="var(--link-mid)" stop-opacity=".88"/>
      <stop offset="62%"  stop-color="var(--link-lo)"  stop-opacity=".82"/>
      <stop offset="100%" stop-color="var(--link-hi)"  stop-opacity=".95"/>
    </linearGradient>
    <symbol id="chainLink" viewBox="0 0 34 24">
      <rect x="3.4" y="3.4" width="27.2" height="17.2" rx="8.6"
            fill="none" stroke="url(#glassRim)" stroke-width="5.2"/>
      <rect x="3.4" y="3.4" width="27.2" height="17.2" rx="8.6"
            fill="none" stroke="var(--link-hi)" stroke-width="1.5" stroke-opacity=".8"/>
      <path d="M9 7.4 A8 8 0 0 1 17 5.2" fill="none"
            stroke="var(--link-hi)" stroke-width="1.8" stroke-linecap="round" stroke-opacity=".95"/>
    </symbol>
  </defs>
</svg>

<div class="shell">

  <header class="topbar">
    <div class="topbar-inner glass">
      <a class="wordmark" href="/" aria-label="作り場 ホーム">
        <svg class="chain" viewBox="0 0 56 24" aria-hidden="true">
          <use href="#chainLink" x="0" y="0" width="34" height="24"/>
          <use href="#chainLink" x="22" y="0" width="34" height="24"/>
        </svg>
        <span class="name">作り場</span>
        <span class="romaji serif">tsukuriba</span>
      </a>
      <div class="topbar-actions">
        <a class="pill glass" href="#works">作ったもの</a>
        <button class="pill glass icon" id="themeToggle" type="button" aria-label="配色を切り替える">◐</button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-copy">
        <p class="eyebrow serif rise d1">tsukuriba</p>
        <h1 class="rise d2">作り場</h1>
        <p class="lede rise d3">
          つくったものを、ここに置いていく。<br>
          思いついた不便を、そのつど手を動かして小さなアプリにしている場所。
        </p>
        <div class="hero-meta rise d4">
          <span class="chip glass"><span class="dot"></span>3つ公開中</span>
          <a class="chip glass link" href="#works">作ったものを見る</a>
          <a class="chip glass link" href="https://github.com/ayarion" target="_blank" rel="noopener">GitHub</a>
        </div>
      </div>

      <div class="stream" aria-hidden="true">
        <div class="stream-col">
          <div class="stream-track" style="--dur:64s">
            <div class="frame"><img src="assets/stream/togame-1-dashboard.webp" alt="" width="520" height="1125" decoding="async"></div>
            <div class="frame"><img src="assets/stream/kinto-1-record.webp" alt="" width="520" height="1125" decoding="async"></div>
            <div class="frame"><img src="assets/stream/togame-7-heatmap.webp" alt="" width="520" height="1125" decoding="async"></div>
            <div class="frame"><img src="assets/stream/kinto-3-graph.webp" alt="" width="520" height="1125" decoding="async"></div>
            <div class="frame"><img src="assets/stream/togame-3-intercept.webp" alt="" width="520" height="1125" decoding="async"></div>
            <!-- duplicate set keeps the loop seamless -->
            <div class="frame"><img src="assets/stream/togame-1-dashboard.webp" alt="" width="520" height="1125" decoding="async"></div>
            <div class="frame"><img src="assets/stream/kinto-1-record.webp" alt="" width="520" height="1125" decoding="async"></div>
            <div class="frame"><img src="assets/stream/togame-7-heatmap.webp" alt="" width="520" height="1125" decoding="async"></div>
            <div class="frame"><img src="assets/stream/kinto-3-graph.webp" alt="" width="520" height="1125" decoding="async"></div>
            <div class="frame"><img src="assets/stream/togame-3-intercept.webp" alt="" width="520" height="1125" decoding="async"></div>
          </div>
        </div>
        <div class="stream-col">
          <div class="stream-track" style="--dur:78s;--delay:-14s">
            <div class="frame"><img src="assets/stream/kinto-2-calendar.webp" alt="" width="520" height="1125" decoding="async"></div>
            <div class="frame"><img src="assets/stream/togame-8-week-open.webp" alt="" width="520" height="1125" decoding="async"></div>
            <div class="frame"><img src="assets/stream/togame-13-settings-conversions.webp" alt="" width="520" height="1125" decoding="async"></div>
            <div class="frame"><img src="assets/stream/togame-11-grace.webp" alt="" width="520" height="1125" decoding="async"></div>
            <div class="frame"><img src="assets/stream/togame-4-followup.webp" alt="" width="520" height="1125" decoding="async"></div>

            <div class="frame"><img src="assets/stream/kinto-2-calendar.webp" alt="" width="520" height="1125" decoding="async"></div>
            <div class="frame"><img src="assets/stream/togame-8-week-open.webp" alt="" width="520" height="1125" decoding="async"></div>
            <div class="frame"><img src="assets/stream/togame-13-settings-conversions.webp" alt="" width="520" height="1125" decoding="async"></div>
            <div class="frame"><img src="assets/stream/togame-11-grace.webp" alt="" width="520" height="1125" decoding="async"></div>
            <div class="frame"><img src="assets/stream/togame-4-followup.webp" alt="" width="520" height="1125" decoding="async"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="works" id="works">
      <div class="section-head rise">
        <h2>作ったもの</h2>
        <span class="count serif">3</span>
        <span class="rule"></span>
      </div>

      <div class="cards">
        <a class="card glass rise" href="https://tsukuriba.org/togame/">
          <span class="thumb"><img src="assets/thumbs/togame-1-dashboard.webp" alt="トガメのダッシュボード画面" width="168" height="168" loading="lazy" decoding="async"></span>
          <span class="body">
            <span class="name">トガメ</span>
            <span class="desc">SNSを開いた瞬間に、なんで開いたのと問い返してくるアプリ</span>
          </span>
          <span class="go" aria-hidden="true">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12 12 4M6 4h6v6"/></svg>
          </span>
        </a>

        <a class="card glass rise" href="https://tsukuriba.org/kinto-log/">
          <span class="thumb"><img src="assets/thumbs/kinto-1-record.webp" alt="Kinto-Logの記録画面" width="168" height="168" loading="lazy" decoding="async"></span>
          <span class="body">
            <span class="name">Kinto-Log</span>
            <span class="desc">かわいく続ける、筋トレ記録アプリ</span>
          </span>
          <span class="go" aria-hidden="true">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12 12 4M6 4h6v6"/></svg>
          </span>
        </a>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  /* theme */
  var root = document.documentElement;
  var stored = null;
  try { stored = localStorage.getItem('theme'); } catch (e) {}
  if (stored) root.setAttribute('data-theme', stored);

  document.getElementById('themeToggle').addEventListener('click', function () {
    var now = root.getAttribute('data-theme') ||
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    var next = now === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch (e) {}
  });

  /* entrance */
  var items = document.querySelectorAll('.rise');
  var calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function showAll() {
    items.forEach(function (el) { el.classList.add('shown'); });
  }

  if (calm || !('IntersectionObserver' in window)) {
    showAll();
  } else {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('shown');
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15, rootMargin: '0px 0px -8% 0px' });

    items.forEach(function (el) { io.observe(el); });
    /* never leave anything stranded invisible */
    setTimeout(showAll, 2500);
  }
</script>
