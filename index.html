<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>作り場 — tsukuriba</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="つくったものを置いておく場所。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231c5cab'/%3E%3Cpath d='M9 21 L16 9 L23 21 Z' fill='none' stroke='white' stroke-width='2.2' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#ffffff;
    --ink:#17171a;
    --ink-2:#55565c;
    --ink-3:#8e8f96;
    --hairline:#e8e8ec;
    --hairline-2:#f2f2f5;
    --accent:#1c5cab;
    --accent-soft:#eef4fc;
    --ease-out:cubic-bezier(0.23, 1, 0.32, 1);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#141416;--ink:#f2f2f4;--ink-2:#b9bac0;--ink-3:#85868c;
      --hairline:#2a2a2e;--hairline-2:#212124;--accent:#6ea8ec;--accent-soft:#1a2740;
    }
  }
  :root[data-theme="dark"]{
    --bg:#141416;--ink:#f2f2f4;--ink-2:#b9bac0;--ink-3:#85868c;
    --hairline:#2a2a2e;--hairline-2:#212124;--accent:#6ea8ec;--accent-soft:#1a2740;
  }
  :root[data-theme="light"]{
    --bg:#ffffff;--ink:#17171a;--ink-2:#55565c;--ink-3:#8e8f96;
    --hairline:#e8e8ec;--hairline-2:#f2f2f5;--accent:#1c5cab;--accent-soft:#eef4fc;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--bg)}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Segoe UI",sans-serif;
    color:var(--ink);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{max-width:640px;margin:0 auto;padding:96px 24px calc(64px + env(safe-area-inset-bottom))}

  header{margin-bottom:56px}
  .eyebrow{font-size:12px;letter-spacing:.16em;color:var(--ink-3);font-weight:600;margin-bottom:12px}
  h1{font-size:40px;font-weight:700;letter-spacing:-0.01em;line-height:1.2}
  .tagline{margin-top:14px;font-size:16px;color:var(--ink-2);max-width:32ch}

  h2{font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--ink-3);margin-bottom:16px}

  .cards{display:flex;flex-direction:column;gap:14px}
  .card{
    display:flex;align-items:center;gap:16px;
    padding:20px;border:1px solid var(--hairline);border-radius:14px;
    text-decoration:none;color:inherit;background:var(--bg);
    transition:transform 200ms var(--ease-out), border-color 200ms var(--ease-out), background 200ms var(--ease-out);
  }
  .card:hover{transform:translateY(-2px);border-color:var(--accent);background:var(--accent-soft)}
  .card:active{transform:translateY(0)}
  .card .icon{flex:none;width:44px;height:44px;border-radius:11px;display:block}
  .card .body{flex:1;min-width:0}
  .card .name{font-size:17px;font-weight:700}
  .card .desc{font-size:13.5px;color:var(--ink-2);margin-top:3px}
  .card .arrow{flex:none;color:var(--ink-3);font-size:18px;transition:transform 200ms var(--ease-out)}
  .card:hover .arrow{transform:translateX(3px);color:var(--accent)}

  .soon{
    display:flex;align-items:center;gap:16px;padding:20px;
    border:1px dashed var(--hairline);border-radius:14px;color:var(--ink-3);font-size:14px;
  }
  .soon .icon{flex:none;width:44px;height:44px;border-radius:11px;border:1px dashed var(--hairline);
    display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink-3)}

  footer{margin-top:56px;font-size:12px;color:var(--ink-3)}
  footer a{color:var(--ink-3)}

  @media (prefers-reduced-motion: reduce){
    .card,.card .arrow{transition:none}
    .card:hover{transform:none}
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <p class="eyebrow">TSUKURIBA</p>
      <h1>作り場</h1>
      <p class="tagline">つくったものを、ここに置いていく。</p>
    </header>

    <main>
      <h2>作ったもの</h2>
      <div class="cards">
        <a class="card" href="/togame/">
          <svg class="icon" viewBox="0 0 32 32" aria-hidden="true">
            <rect width="32" height="32" rx="7" fill="#eef4fc"/>
            <g transform="translate(0 0)">
              <ellipse cx="6" cy="10" rx="3" ry="2.2" fill="#2f8f5b" transform="rotate(-30 6 10)"/>
              <ellipse cx="26" cy="10" rx="3" ry="2.2" fill="#2f8f5b" transform="rotate(30 26 10)"/>
              <ellipse cx="6" cy="23" rx="3" ry="2.2" fill="#2f8f5b" transform="rotate(30 6 23)"/>
              <ellipse cx="26" cy="23" rx="3" ry="2.2" fill="#2f8f5b" transform="rotate(-30 26 23)"/>
              <path d="M16 29 L13.3 24.6 L18.7 24.6 Z" fill="#2f8f5b"/>
              <circle cx="16" cy="5.2" r="3.4" fill="#2f8f5b"/>
              <circle cx="16" cy="17" r="12" fill="#146b3a"/>
              <circle cx="16" cy="17" r="9" fill="#f2fbf6"/>
              <line x1="16" y1="17" x2="16" y2="12" stroke="#12321f" stroke-width="1.5" stroke-linecap="round"/>
              <line x1="16" y1="17" x2="19.4" y2="15.1" stroke="#12321f" stroke-width="1.5" stroke-linecap="round"/>
              <circle cx="16" cy="17" r="1" fill="#12321f"/>
            </g>
          </svg>
          <div class="body">
            <div class="name">トガメ</div>
            <div class="desc">SNSを開くと「なんで開いたの？」と理由を問い詰めるアプリ</div>
          </div>
          <span class="arrow">→</span>
        </a>

        <a class="card" href="/kinto-log/">
          <svg class="icon" viewBox="0 0 32 32" aria-hidden="true">
            <rect width="32" height="32" rx="7" fill="#eaf6fb"/>
            <rect x="0.5" y="13.5" width="2.6" height="5" rx="1.3" fill="#1f6f96"/>
            <rect x="29" y="13.5" width="2.6" height="5" rx="1.3" fill="#1f6f96"/>
            <rect x="3.2" y="11" width="4.2" height="10" rx="1.6" fill="#2f8fbf"/>
            <rect x="24.6" y="11" width="4.2" height="10" rx="1.6" fill="#2f8fbf"/>
            <rect x="6.5" y="14.5" width="19" height="3" rx="1.5" fill="#2f8fbf"/>
          </svg>
          <div class="body">
            <div class="name">Kinto-Log</div>
            <div class="desc">かわいく続ける、筋トレ記録アプリ</div>
          </div>
          <span class="arrow">→</span>
        </a>

        <a class="card" href="/OjiMate/">
          <svg class="icon" viewBox="0 0 32 32" aria-hidden="true">
            <rect width="32" height="32" rx="7" fill="#fff1e0"/>
            <circle cx="7" cy="18.5" r="2.6" fill="#e8a97a"/>
            <circle cx="25" cy="18.5" r="2.6" fill="#e8a97a"/>
            <circle cx="16" cy="17" r="9" fill="#e8a97a"/>
            <ellipse cx="14.3" cy="12.4" rx="3.6" ry="2" fill="#ffffff" opacity="0.55"/>
            <ellipse cx="13.4" cy="15.6" rx="0.9" ry="1.1" fill="#4a3a2c"/>
            <ellipse cx="18.6" cy="15.6" rx="0.9" ry="1.1" fill="#4a3a2c"/>
            <path d="M11.5 20.4 Q16 22.3 20.5 20.4" stroke="#8a5a3c" stroke-width="1.6" fill="none" stroke-linecap="round"/>
          </svg>
          <div class="body">
            <div class="name">OjiMate</div>
            <div class="desc">集中すれば働き、サボれば一緒にサボる、表裏一体のおじさんと暮らす集中アプリ</div>
          </div>
          <span class="arrow">→</span>
        </a>

        <div class="soon">
          <span class="icon">＋</span>
          <div>次の作品はここに増えていきます</div>
        </div>
      </div>
    </main>

    <footer>
      © <span id="y"></span> 作り場
    </footer>
  </div>
  <script>document.getElementById('y').textContent=new Date().getFullYear();</script>
</body>
</html>
